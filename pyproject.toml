[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indonesian-crypto-research"
version = "4.0.0"
description = "Indonesian Cryptocurrency Market Integration, Currency Conversion, Stablecoin-FX Basis Decomposition, and Transaction-Cost Frictions"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=7.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
